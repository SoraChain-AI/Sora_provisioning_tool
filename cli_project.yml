api_version: 3
name: cli_test_project
description: CLI Provisioning Test Project

participants:
  # FL Server
  - name: FLServer.com
    host: FLServer.com
    type: server
    org: nvidia
    fed_learn_port: 8002
    admin_port: 8003
    props:
      connection_security: mtls
      default_host: FLServer.com
      max_clients: 50
      session_timeout: 3600

  # FL Client
  - name: site-1
    type: client
    org: nvidia
    props:
      capacity: {"num_gpus": 2, "gpu_memory": 16}
      description: "Test client site 1"
      
  # Project Administrator
  - name: test2@nvidia.com
    host: FLServer.com
    type: admin
    org: nvidia
    role: project_admin

# Builders configuration
builders:
  - path: nvflare.lighter.impl.workspace.WorkspaceBuilder
    args:
      template_file:
        - master_template.yml

  - path: nvflare.lighter.impl.template.TemplateBuilder

  - path: nvflare.lighter.impl.static_file.StaticFileBuilder
    args:
      config_folder: config
      scheme: grpc
      docker_image: nvflare/nvflare
      overseer_agent:
        path: nvflare.ha.dummy_overseer_agent.DummyOverseerAgent
        overseer_exists: false
        args:
          sp_end_point: FLServer.com:8002:8003

  - path: nvflare.lighter.impl.cert.CertBuilder
  - path: nvflare.lighter.impl.signature.SignatureBuilder

# Project properties
project_props:
  fl_framework: "nvflare"
  scheme: "grpc"
  
# Server properties
server_props:
  max_clients: 50
  session_timeout: 3600
  connection_security: "mtls"
